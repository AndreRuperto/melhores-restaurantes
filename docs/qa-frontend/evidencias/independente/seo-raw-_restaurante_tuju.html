    <script id="profile-data" type="application/json">{"slug":"tuju","lastReviewedAt":"2026-11-10","verificationStatus":"partial","imageStatus":"historical-or-context","lede":"Numa rua sem saída do Jardim Paulistano, em São Paulo, o Tuju organiza o menu degustação pelo regime de chuvas da cidade, e não pelas quatro estações do calendário. Comandado por Ivan Ralston, foi em 2026 um dos dois primeiros restaurantes da América Latina a receber três estrelas Michelin.","hero":{"src":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Lurocalis_semitorquatus_-_Short-tailed_Nighthawk%3B_Botanic_Garden%2C_S%C3%A3o_Paulo%2C_Brazil.jpg/1920px-Lurocalis_semitorquatus_-_Short-tailed_Nighthawk%3B_Botanic_Garden%2C_S%C3%A3o_Paulo%2C_Brazil.jpg","page":"https://commons.wikimedia.org/wiki/File:Lurocalis_semitorquatus_-_Short-tailed_Nighthawk;_Botanic_Garden,_S%C3%A3o_Paulo,_Brazil.jpg","author":"Hector Bottai","license":"CC BY-SA 4.0","caption":"O tuju (Lurocalis semitorquatus), ave sul-americana que dá nome ao restaurante, no Jardim Botânico de São Paulo.","illustrative":false,"kind":"context","subject":"O tuju, ave que dá nome ao restaurante, no Jardim Botânico de São Paulo","alt":"Ave de plumagem marrom pintalgada pousada num galho coberto de líquen","capturedAt":"2018-10-26","verifiedAt":"2026-11-10","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","rightsStatus":"approved","rightsEvidence":"Página do arquivo no Wikimedia Commons; autor, licença e data conferidos pela API do Commons em 2026-11-10 (docs/lotes/fase-2-evidencias/commons-L03.json).","attribution":"Hector Bottai, CC BY-SA 4.0, via Wikimedia Commons","modifications":"Miniatura redimensionada pelo servidor do Wikimedia; sem recorte ou outra alteração."},"founded":2014,"founders":["Ivan Ralston"],"chef":{"name":"Ivan Ralston","bio":"Nascido em São Paulo em 1985, Ivan Ralston é filho dos fundadores da rede de restaurantes Ráscal. Estudou música na Berklee College of Music, nos Estados Unidos, antes de se dedicar à cozinha, e trabalhou no Mugaritz e no El Celler de Can Roca, na Espanha, e no RyuGin, em Tóquio. Abriu o Tuju aos 28 anos e hoje divide o comando da casa com a pesquisadora Katherina Cordás, sua companheira e diretora de pesquisa e hospitalidade do restaurante."},"history":["O Tuju abriu em 2014 numa casa da Vila Madalena, em São Paulo, com o nome de uma ave sul-americana. No ano seguinte, recebeu a primeira estrela do Guia Michelin; a segunda veio em 2018. Na época, a casa cultivava mais de 350 espécies comestíveis, que forneciam todas as folhas usadas no menu. O restaurante também entrou na lista Latin America's 50 Best Restaurants, na qual foi o 45º colocado em 2017.","Com a pandemia de covid-19, o Tuju fechou. Durante o intervalo de cerca de três anos, Ralston e Katherina Cordás viajaram pelos biomas brasileiros e estudaram ingredientes e cozinha do país. O restaurante reabriu em setembro de 2023, num prédio de três andares projetado pelo arquiteto Angelo Bucci na Rua Frei Galvão, no Jardim Paulistano. A nova casa tem nove mesas, recebe cerca de 30 pessoas por serviço, cerca de um terço do público do endereço anterior, e abriga um centro de pesquisa dedicado a ingredientes e sazonalidade.","A segunda fase acelerou o reconhecimento. Menos de um ano após a reabertura, o Tuju voltou a ter duas estrelas Michelin e ganhou a estrela verde, por práticas de sustentabilidade. Na Latin America's 50 Best Restaurants foi 16º em 2024, com o prêmio de hospitalidade da lista, e 8º em 2025, como melhor restaurante do Brasil. Em 2025 estreou no ranking mundial, em 70º lugar. Em abril de 2026 recebeu a terceira estrela Michelin, ao lado do também paulistano Evvai, e em novembro, na cerimônia de Lima, entrou no top 50 mundial em 16º, com o prêmio de maior estreia (Highest New Entry Award) e o Art of Hospitality Award."],"cuisine":{"style":"Cozinha sazonal paulistana","paragraphs":["Ralston define o que faz como cozinha \"sazonal paulista\". Em vez de primavera, verão, outono e inverno, o Tuju divide o ano em quatro menus batizados segundo o clima de São Paulo: Umidade, Chuva, Ventania e Seca. As trocas não têm data fixa e seguem o tempo de cada ano; em 2026, com o El Niño, a temporada de cogumelos durou quase o dobro do normal, segundo o chef. O menu degustação tem cerca de dez etapas e é planejado com meses de antecedência.","A base são ingredientes de pequenos produtores do estado de São Paulo e carnes de fazendas com critérios sociais e ambientais; frutas nativas aparecem nas sobremesas. O centro de pesquisa da casa, dirigido por Katherina Cordás, estuda os ingredientes a partir das regiões e épocas em que são produzidos. A refeição percorre os três andares do prédio: começa no pátio, ao lado de uma jabuticabeira e de uma adega envidraçada com cerca de 5 mil garrafas, segue para o salão com cozinha aberta e termina no terraço, com queijos, chocolates e mel de abelhas nativas sem ferrão. O restaurante reaproveita a água da chuva."]},"dishes":[{"name":"Caranguejo com bacalhau e cenoura","desc":"Combinação de caranguejo, bacalhau e cenoura citada pela The 50 Best entre os pratos de destaque da casa.","photo":{"src":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/Siri_Azul_%28Callinectes_sapidus%29_-_S%C3%A3o_Sebasti%C3%A3o%2C_SP.jpg/1920px-Siri_Azul_%28Callinectes_sapidus%29_-_S%C3%A3o_Sebasti%C3%A3o%2C_SP.jpg","page":"https://commons.wikimedia.org/wiki/File:Siri_Azul_(Callinectes_sapidus)_-_S%C3%A3o_Sebasti%C3%A3o,_SP.jpg","author":"Danesof","license":"CC BY-SA 4.0","caption":"Siri-azul em manguezal de São Sebastião, no litoral paulista (imagem ilustrativa; não é necessariamente o crustáceo usado no prato).","illustrative":true,"kind":"context","subject":"Siri-azul do litoral paulista (ilustrativa)","alt":"Siri-azul na palma de uma mão","capturedAt":"2019-06-16","verifiedAt":"2026-11-10","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","rightsStatus":"approved","rightsEvidence":"Página do arquivo no Wi
