name: A Carta - QA frontend e cascata CSS

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/frontend/**'
      - 'playwright.frontend.config.cjs'
      - '.github/workflows/qa-frontend-css.yml'
      - 'AGENTS.md'
      - 'docs/qa-frontend/**'
  workflow_dispatch:

jobs:
  css-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:profiles
      - run: npm run build
      - run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config=playwright.frontend.config.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-css-evidencias
          path: |
            frontend-test-results/
            frontend-playwright-report/
          retention-days: 7
          if-no-files-found: ignore
