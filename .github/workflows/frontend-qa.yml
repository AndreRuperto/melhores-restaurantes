name: Frontend QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:profiles
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test production HTML, layout and accessibility
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/preview.log 2>&1 &
          npx serve dist -l tcp://127.0.0.1:4177 --no-clipboard > /tmp/production.log 2>&1 &
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:4174/ > /dev/null && curl --silent --fail http://127.0.0.1:4177/ > /dev/null && break; sleep 1; done
          node scripts/validate-seo.mjs --http=http://127.0.0.1:4174 --http=http://127.0.0.1:4177
          node scripts/qa/layout.mjs
          node scripts/qa/rotas-final.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-qa-evidence
          path: docs/qa-frontend/evidencias
